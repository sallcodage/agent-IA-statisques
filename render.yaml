services:
  - type: web
    name: agent-ia-statistiques-backend
    env: python
    plan: free

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt

    preDeployCommand: |
      python manage.py migrate
      python manage.py collectstatic --noinput
      python manage.py shell -c "from config.apps.statistiques.models import StatistiqueRegionale; print('TOTAL DONNEES:', StatistiqueRegionale.objects.count())"

    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT


    envVars:

      - key: DJANGO_SECRET_KEY
        sync: false

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: "agent-ia-statistiques.onrender.com"


      - key: DATABASE_URL
        sync: false